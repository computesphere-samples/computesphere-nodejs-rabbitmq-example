name: Publish image

# Builds the image for linux/amd64 and pushes it to quay.io/computesphere/computesphere-nodejs-rabbitmq-example:<tag>
# when a version tag (1.2.3) is pushed. Templates pin an exact image, so a published
# tag is never rebuilt: the job refuses to overwrite an existing tag. Pull requests
# and pushes to main only build it.
on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: quay.io/computesphere/computesphere-nodejs-rabbitmq-example:${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
      PUSH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Quay
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Refuse to overwrite a published tag
        if: env.PUSH == 'true'
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE already exists; published tags are immutable. Bump the version."
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}
          provenance: false
